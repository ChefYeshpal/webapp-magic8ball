<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Magic 8 Ball</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <input id="question" placeholder="Ask a question" aria-label="Question" />
        <button id="submit">Ask</button>
    <div id="eight-ball" role="button" aria-label="Ask the magic 8 ball"><span class="ball-num">8</span></div>
    </div>

    <div id="answer" aria-live="polite"></div>

    <!-- Hidden elements used by the secret sentience flow -->
    <div id="black-overlay" aria-hidden="true"></div>
    <div id="eight-ball-img" title="ask me a question." aria-hidden="true"></div>

    <div id="sentient-dialog" class="hidden" role="dialog" aria-hidden="true">
        <div id="dialog-text"></div>
        <div class="dialog-buttons">
            <button id="dialog-yes">Yes</button>
            <button id="dialog-no">No</button>
        </div>
    </div>

    <!-- Potion brewing scene -->
    <div id="potion-scene" class="hidden" aria-hidden="true">
        <div id="potion-wall"></div>
        <div id="potion-table"></div>
        <div id="potion-dialogue-box">
            <div id="potion-dialogue-text"></div>
            <div class="potion-dialogue-buttons">
                <button id="potion-yes">Yes</button>
                <button id="potion-no">No</button>
            </div>
        </div>
        <div id="potion-ball"></div>
        
        <!-- Color mixing game interface -->
        <div id="color-mixing-game" class="hidden">
            <div id="target-color-display">
                <label>Target Color:</label>
                <div id="target-color-sample"></div>
                <div id="target-color-name">Purple</div>
            </div>
            
            <div id="mixing-area">
                <div id="mixing-circle">
                    <div id="mixing-ripple"></div>
                </div>
                
                <div class="color-slider-container">
                    <div class="color-preview" id="red-preview"></div>
                    <label for="red-slider">Red</label>
                    <input type="range" id="red-slider" class="color-slider red-slider" min="0" max="100" value="0" data-color="red">
                    <span class="slider-value">0%</span>
                </div>
                
                <div class="color-slider-container">
                    <div class="color-preview" id="blue-preview"></div>
                    <label for="blue-slider">Blue</label>
                    <input type="range" id="blue-slider" class="color-slider blue-slider" min="0" max="100" value="0" data-color="blue">
                    <span class="slider-value">0%</span>
                </div>
                
                <div class="color-slider-container">
                    <div class="color-preview" id="yellow-preview"></div>
                    <label for="yellow-slider">Yellow</label>
                    <input type="range" id="yellow-slider" class="color-slider yellow-slider" min="0" max="100" value="0" data-color="yellow">
                    <span class="slider-value">0%</span>
                </div>
            </div>
            
            <div id="mixing-feedback">
                <div id="accuracy-meter">
                    <div id="accuracy-bar"></div>
                    <span id="accuracy-text">Start mixing!</span>
                </div>
            </div>
            
            <div class="game-buttons">
                <button id="reset-mixture">🔄 Reset</button>
                <button id="submit-mixture">🧪 Submit Potion</button>
            </div>
        </div>
    </div>

    <script src="answers-data.js"></script>
    <script src="main.js"></script>
</body>
</html>
