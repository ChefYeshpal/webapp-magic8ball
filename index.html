<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magic 8 Ball</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Content warning modal (hidden by default) -->
  <div id="grim-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="grim-title" aria-describedby="grim-desc" hidden>
    <div class="modal-card" role="document">
      <h2 id="grim-title">Content warning</h2>
      <p id="grim-desc">This story contains some bad endings for Timmy. It may include dark themes such as addiction, homelessness, and self-harm. Do you still want to play?</p>
      <div class="modal-actions">
        <button id="grim-yes" class="grim-btn yes">Yes</button>
        <button id="grim-no" class="grim-btn no">No</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Center glass window with seeker dialogue -->
    <div class="glass-window">
      <div class="glass-highlight"></div>
      <div class="seeker-card" id="seeker-dialogue">
        <div class="quote-mark left">"</div>
        <div class="dialogue-text" id="dialogue-text">Click an option to ask the Magic 8 Ball...</div>
        <div class="quote-mark right">"</div>
      </div>
    </div>
    
    <!-- Options positioned around the window in the black area -->
    <div class="options-container" id="options-container">
      <!-- Options will be dynamically positioned here -->
    </div>
    
    <!-- Connection line SVG -->
     <!-- This doesn't really work, and I dont wanna remove it now cause I can. -->
    <svg class="connection-line" id="connection-line">
      <path id="connection-path"></path>
    </svg>
  </div>

  <script src="answers-data.js"></script>
  <script src="timmy-dialogue.js"></script>
  <script src="tree.js"></script>
  <script src="main.js"></script>
</body>
</html>
