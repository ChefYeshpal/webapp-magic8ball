<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Magic 8 Ball</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <input id="question" placeholder="Ask a question" aria-label="Question" />
        <button id="submit">Ask</button>
        <div id="eight-ball" aria-hidden="true">8</div>
    </div>

    <div id="answer" aria-live="polite"></div>

    <!-- Hidden elements used by the secret sentience flow -->
    <div id="black-overlay" aria-hidden="true"></div>
    <img id="eight-ball-img" src="8ball.png" alt="Magic 8 Ball" aria-hidden="true">

    <div id="sentient-dialog" class="hidden" role="dialog" aria-hidden="true">
        <div id="dialog-text"></div>
        <div class="dialog-buttons">
            <button id="dialog-yes">Yes</button>
            <button id="dialog-no">No</button>
        </div>
    </div>

    <script src="answers-data.js"></script>
    <script src="main.js"></script>
</body>
</html>
