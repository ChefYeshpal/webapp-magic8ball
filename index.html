<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magic 8 Ball</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Center glass window with seeker dialogue -->
    <div class="glass-window">
      <div class="glass-highlight"></div>
      <div class="seeker-card" id="seeker-dialogue">
        <div class="quote-mark left">"</div>
        <div class="dialogue-text" id="dialogue-text">Click an option to ask the Magic 8 Ball...</div>
        <div class="quote-mark right">"</div>
      </div>
    </div>
    
    <!-- Options positioned around the window in the black area -->
    <div class="options-container" id="options-container">
      <!-- Options will be dynamically positioned here -->
    </div>
    
    <!-- Connection line SVG -->
    <svg class="connection-line" id="connection-line">
      <path id="connection-path"></path>
    </svg>
  </div>

  <script src="answers-data.js"></script>
  <script src="timmy-dialogue.js"></script>
  <script src="tree.js"></script>
  <script src="main.js"></script>
</body>
</html>
